<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ============================================= -->
  <!-- 1. تحسين محركات البحث (Google SEO) -->
  <!-- ============================================= -->
  <title>Esahub | منصة المشاريع والخدمات الرقمية</title>
  <meta name="description" content="Esahub هو المركز الموحد لجميع مشاريع وتطبيقات SS0Lapps. منصة احترافية تجمع أفضل الخدمات الرقمية والتطبيقات في مكان واحد.">
  <meta name="keywords" content="Esahub, SS0Lapps, Hubapps, مشاريع رقمية, تطبيقات, برمجيات">
  <meta name="author" content="SS0Lapps">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ss0lapps.github.io/Hubapps/">

  <!-- ============================================= -->
  <!-- 2. إعدادات معاينة الواتساب وفيسبوك (Open Graph) -->
  <!-- ============================================= -->
  <meta property="og:title" content="Esahub - Hub For All My Projects">
  <meta property="og:description" content="منصة احترافية للمشاريع والخدمات الرقمية المتميزة. اضغط للاستكشاف.">
  <meta property="og:image" content="https://ss0lapps.github.io/Hubapps/logo54.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://ss0lapps.github.io/Hubapps/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Esahub">

  <!-- ============================================= -->
  <!-- 3. إعدادات معاينة تويتر (X Card) -->
  <!-- ============================================= -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Esahub | منصة المشاريع الرقمية">
  <meta name="twitter:description" content="استكشف جميع مشاريع وتطبيقات Esahub في مكان واحد.">
  <meta name="twitter:image" content="https://ss0lapps.github.io/Hubapps/logo54.png">

  <!-- أيقونة الموقع في المتصفح (Favicon) -->
  <link rel="icon" type="image/png" href="logo54.png">

  <style>
    /* إعادة ضبط الشاشة والتصميم الأساسي */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* لمنع شريط السكرول المزدوج */
      background-color: #000000; /* لون خلفية أسود متناسق مع الشعار */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* حاوية الـ iframe */
    .app-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <iframe 
      src="https://website-files-direct--alliesattacks.replit.app" 
      title="Esahub App"
      allow="fullscreen; autoplay; clipboard-write; encrypted-media"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
      loading="eager">
    </iframe>
  </div>

  <!-- ============================================= -->
  <!-- 4. سكربت حماية بسيط لمنع القائمة والتحديد -->
  <!-- ============================================= -->
  <script>
    // تعطيل زر كليك يمين
    document.addEventListener('contextmenu', e => e.preventDefault());

    // تعطيل اختصارات أدوات المطور الشهيرة
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || 
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) || 
          (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
