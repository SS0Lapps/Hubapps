<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esahub | منصة المشاريع والخدمات</title>
  <style>
    /* إعادة ضبط الهوامش والشاشة بالكامل */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* لمنع السكرول المزدوج */
      background-color: #0f172a; /* لون خلفية مريح أثناء التحميل */
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* حاوية الـ iframe لملء الشاشة */
    .iframe-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <iframe 
      src="https://website-files-direct--alliesattacks.replit.app" 
      title="Esahub Webview"
      allow="fullscreen; autoplay; clipboard-write; encrypted-media"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals">
    </iframe>
  </div>

</body>
</html>
